<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
  <link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&display=swap" rel="stylesheet">
  <link rel="icon" type="png" href="./icons/Logo_RobinHost.co.png">
  <link rel="stylesheet" href="./css/style.css">
  
  <title>Generador de Contraseñas</title>
</head>
<body>
  


  <main class="main-content">
    <div class="bg-blob"></div>

    <div class="pass-gen">
      
      <!-- Header -->
      <div class="pass-gen__header">
        <h1 class="pass-gen__title">Generador de Contraseñas</h1>
        <p class="pass-gen__subtitle">Crea una contraseña segura y robusta.</p>
      </div>

      <!-- Display -->
      <div class="password-group" id="passwordGroup">
        <input type="text" class="password-group__input" id="passwordOutput" readonly aria-label="Contraseña generada" value="Cargando..." />
        <button class="password-group__copy-btn" id="copyBtn" aria-label="Copiar contraseña">
          <span class="material-symbols-outlined password-group__copy-icon" id="copyIcon">content_copy</span>
        </button>
      </div>

      <!-- Controls -->
      <div class="pass-gen__controls">
        
        <!-- Length Slider -->
        <div class="pass-gen__length">
          <div class="pass-gen__length-header">
            <span>Longitud de contraseña</span>
            <span class="pass-gen__length-badge" id="lengthDisplay">15</span>
          </div>
          <input type="range" id="lengthRange" min="10" max="25" step="1" value="15" class="pass-gen__range"/>
        </div>

        <hr class="pass-gen__divider">

        <!-- Switches -->
        <div class="pass-gen__switches">
          
          <label class="pass-gen__switch">
            <span class="pass-gen__switch-label">Mayúsculas (A-Z)</span>
            <input type="checkbox" id="checkUppercase" class="pass-gen__switch-input" checked>
            <div class="pass-gen__switch-track">
              <span class="pass-gen__switch-thumb"></span>
            </div>
          </label>

          <label class="pass-gen__switch">
            <span class="pass-gen__switch-label">Minúsculas (a-z)</span>
            <input type="checkbox" id="checkLowercase" class="pass-gen__switch-input" checked>
            <div class="pass-gen__switch-track">
              <span class="pass-gen__switch-thumb"></span>
            </div>
          </label>

          <label class="pass-gen__switch">
            <span class="pass-gen__switch-label">Números (0-9)</span>
            <input type="checkbox" id="checkNumbers" class="pass-gen__switch-input" checked>
            <div class="pass-gen__switch-track">
              <span class="pass-gen__switch-thumb"></span>
            </div>
          </label>

          <label class="pass-gen__switch">
            <span class="pass-gen__switch-label">Símbolos (!@#$%)</span>
            <input type="checkbox" id="checkSymbols" class="pass-gen__switch-input" checked>
            <div class="pass-gen__switch-track">
              <span class="pass-gen__switch-thumb"></span>
            </div>
          </label>

        </div>
      </div>

      <!-- Action Button -->
      <button class="pass-gen__btn-primary" id="generateBtn">
        <span class="material-symbols-outlined">refresh</span>
        Generar Nueva Contraseña
      </button>
      
      <!-- Mensaje de Error (vacío por defecto) -->
      <div class="pass-gen__error" id="errorMessage" aria-live="polite"></div>
    </div>
  </main>

  <!-- Modal para Contraseñas Guardadas -->
  <div class="modal modal--hidden" id="savedModal" aria-hidden="true">
    <div class="modal__content">
      <div class="modal__header">
        <div>
          <h2 class="modal__title">Contraseñas guardadas</h2>
          <p class="modal__description">Contraseñas generadas y copiadas anteriormente.</p>
        </div>
        <button class="modal__close" id="closeSavedBtn" aria-label="Cerrar modal">
          <span class="material-symbols-outlined">close</span>
        </button>
      </div>
      <ul class="modal__list" id="savedList"></ul>
    </div>
  </div>

  <!-- Toast -->
  <div class="toast toast--hidden" id="toastTaskOK" aria-live="polite">
    <span class="material-symbols-outlined toast__icon">task_alt</span>
    <span class="toast__text">¡Acción exitosa!</span>
  </div>

  <script src="./js/pssw.js"></script>
</body>
</html>
